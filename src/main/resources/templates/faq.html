<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">FAQ</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}" th:text="${brand}">Help Desk</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}" th:text="${navHome}">Home</a>
            <a class="nav-link" th:href="@{/tickets/new}">Создать заявку</a>
            <a class="nav-link" th:href="@{/admin/tickets}">Админ-панель</a>
            <a class="nav-link" th:href="@{/about}" th:text="${navAbout}">About</a>
            <a class="nav-link" th:href="@{/contacts}" th:text="${navContacts}">Contacts</a>
            <a class="nav-link active" th:href="@{/faq}" th:text="${navFaq}">FAQ</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <h1 class="fw-bold mb-4" th:text="${pageTitle}">FAQ</h1>
    <div class="list-group shadow-sm">
        <div class="list-group-item" th:each="question : ${questions}">
            <h2 class="h5 mb-2" th:text="${question}">Question</h2>
            <p class="mb-0 text-muted" th:text="${faqAnswer}">
                Answer
            </p>
        </div>
    </div>
</main>
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
